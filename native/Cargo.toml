# Horizon Mobile's native library: Horizon's game built as libhorizon.so for an
# Android NativeActivity. scripts/build-native.sh copies this folder into the
# patched Horizon checkout as crates/horizon-android, so it builds in Horizon's
# workspace (its patched wgpu-hal and naga) and next to horizon-client, whose
# `game` module it compiles (lib path below).
#
# The dependencies are horizon-client's own (crates/horizon-client/Cargo.toml at
# the pinned commit), less the desktop-only ones: controllers (gilrs), Windows
# resources and the macOS window calls. Keep them in step when the pin moves.
[package]
name = "horizon-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Horizon on Android: the game as a native activity library"
publish = false

[lib]
name = "horizon"
path = "../horizon-client/src/android.rs"
crate-type = ["cdylib"]

[dependencies]
horizon-client = { path = "../horizon-client", default-features = false, features = ["audio"] }
horizon-assets = { path = "../horizon-assets" }
horizon-client-core = { path = "../horizon-client-core" }
horizon-client-input = { path = "../horizon-client-input" }
horizon-client-render = { path = "../horizon-client-render", features = ["audio"] }
horizon-command = { path = "../horizon-command" }
horizon-items = { path = "../horizon-items" }
horizon-core = { path = "../horizon-core" }
horizon-threads = { path = "../horizon-threads" }
horizon-hdr = { path = "../horizon-hdr" }
horizon-world = { path = "../horizon-world" }
horizon-protocol = { path = "../horizon-protocol" }
horizon-server-files = { path = "../horizon-server-files" }
horizon-anticheat = { path = "../horizon-anticheat" }
horizon-chat-filter = { path = "../horizon-chat-filter" }
horizon-shaders = { path = "../horizon-shaders" }
horizon-shader-api = { path = "../horizon-shader-api" }
horizon-friends = { path = "../horizon-friends" }
horizon-narrator = { path = "../horizon-narrator" }
horizon-mods = { path = "../horizon-mods", default-features = false, features = ["index"] }
horizon-theme = { path = "../horizon-theme" }
horizon-telemetry = { path = "../horizon-telemetry", default-features = false, features = ["live"] }
horizon-bench = { path = "../horizon-bench" }
# Vulkan first; OpenGL ES where a phone's Vulkan driver is missing or too old.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "wgsl", "naga-ir"] }
# The window and its input come from the NativeActivity (android-activity).
winit = { version = "0.30.13", features = ["android-native-activity"] }
pollster = "0.4"
bytemuck = { version = "1.24", features = ["derive"] }
glam = "0.30"
png = "0.18"
sha2 = "0.10.9"
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
naga = { version = "30.0.1", features = ["wgsl-in", "hlsl-out"] }
miniz_oxide = "0.8"
ab_glyph = "0.2.32"
log = "0.4"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
unicode-bidi = "0.3.18"
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
rustix = { version = "1", default-features = false, features = ["std", "time", "process", "fs"] }

# The game module's `cfg(feature = ...)`s are this crate's: controllers stay off
# (gilrs has no Android backend); `audio` is on through the dependencies above.
[features]
controllers = []

[lints]
workspace = true
