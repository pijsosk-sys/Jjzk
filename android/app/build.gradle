plugins {
    id "com.android.application"
}

android {
    namespace "com.horizonmobile"
    compileSdk 35

    defaultConfig {
        applicationId "com.horizonmobile"
        // API 26: AAudio for the game's sound.
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
        ndk {
            // The ABIs scripts/build-native.sh built (arm64-v8a by default).
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs; use your own key to publish.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            // NativeActivity loads libhorizon.so from the APK's lib/ folder.
            useLegacyPackaging true
        }
    }
}
