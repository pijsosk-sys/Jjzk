# Builds the Horizon Mobile APK: Horizon at HORIZON_COMMIT with the Android
# patch, as libhorizon.so for arm64-v8a, inside the launcher app.
name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust with the Android target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - name: Android NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/horizon/target
          key: horizon-android-${{ hashFiles('HORIZON_COMMIT', 'patches/**', 'native/**') }}
          restore-keys: horizon-android-

      - name: Build libhorizon.so
        run: scripts/build-native.sh --release arm64-v8a

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: horizon-mobile-apk
          path: android/app/build/outputs/apk/release/*.apk
