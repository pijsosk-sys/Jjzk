name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Publishes the prebuilt Boddy system (Debian arm64 with the desktop, apps and AI tools already
  # installed) that the app downloads on first run. Rebuilt only when its inputs change, since
  # the tag is a hash of them.
  rootfs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag
        id: tag
        run: |
          hash=$(cat scripts/build-rootfs.sh app/src/main/assets/boddy/packages.txt \
            app/src/main/assets/boddy/apt-boddy.conf app/src/main/assets/boddy/dpkg-boddy.cfg \
            | sha256sum | cut -c1-10)
          echo "tag=rootfs-full-$hash" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        id: check
        run: |
          if gh release view "${{ steps.tag.outputs.tag }}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.check.outputs.exists != 'true' && github.event_name != 'pull_request'
        with:
          platforms: arm64

      - name: Build and publish rootfs
        if: steps.check.outputs.exists != 'true' && github.event_name != 'pull_request'
        run: |
          docker run --platform linux/arm64 --name boddyfs -v "$PWD:/src:ro" debian:trixie \
            bash /src/scripts/build-rootfs.sh
          docker export boddyfs | xz -T0 -8 > debian-arm64.tar.xz
          sha256sum debian-arm64.tar.xz | cut -d' ' -f1 > debian-arm64.tar.xz.sha256
          ls -lh debian-arm64.tar.xz
          gh release create "${{ steps.tag.outputs.tag }}" debian-arm64.tar.xz debian-arm64.tar.xz.sha256 \
            -R "$GITHUB_REPOSITORY" --latest=false \
            --title "Boddy system image (${{ steps.tag.outputs.tag }})" \
            --notes "Prebuilt Boddy system downloaded by the app on first run. Not an app download." \
            || gh release view "${{ steps.tag.outputs.tag }}" -R "$GITHUB_REPOSITORY" >/dev/null  # another run published it

  build:
    needs: rootfs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Catches the launcher bugs that are cheap to catch here: shell syntax, and studio-app.sh
      # drifting away from the messages the studio launcher actually prints.
      - name: Check scripts
        run: |
          for f in app/src/main/assets/boddy/*.sh app/src/main/assets/boddy/studio \
                   app/src/main/assets/boddy/boddy-ctl app/src/main/assets/boddy/roblox-tool \
                   app/src/main/assets/boddy/mcbot; do
            bash -n "$f"
          done
          node --check app/src/main/assets/boddy/mcbot.js
          python3 tests/test_launcher.py
          bash tests/test_roblox_tool.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install patchelf
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Point the app at the system image
        run: |
          echo "https://github.com/${{ github.repository }}/releases/download/${{ needs.rootfs.outputs.tag }}/debian-arm64.tar.xz" \
            > app/src/main/assets/rootfs.txt
          cat app/src/main/assets/rootfs.txt

      - name: Fetch proot binaries
        run: ./scripts/fetch-proot.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Boddy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Boddy-apk
          path: Boddy.apk

      # Every push publishes a release, so the newest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/Boddy.apk
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Boddy test build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Boddy.apk
          body: |
            Test build of Boddy, a no-root Linux desktop for Android.
            Download **Boddy.apk** below and open it on your phone (allow "install unknown apps" when asked).

      # Also keep the newest APK under a git tag so it can be fetched with plain git.
      - name: Store APK in apk-latest tag
        if: github.event_name != 'pull_request'
        run: |
          blob=$(git hash-object -w Boddy.apk)
          tree=$(printf '100644 blob %s\tBoddy.apk\n' "$blob" | git mktree)
          commit=$(git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit-tree "$tree" -m "Boddy APK, build ${{ github.run_number }}")
          git push -f origin "$commit:refs/tags/apk-latest"
