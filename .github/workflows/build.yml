name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Publishes the Debian base system the app downloads on first run, once per ROOTFS_TAG.
  # It's the official debian:trixie arm64 image, exported (no emulation needed).
  rootfs:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ROOTFS_TAG: rootfs-debian-trixie-1
    steps:
      - name: Check for existing release
        id: check
        run: |
          if gh release view "$ROOTFS_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish rootfs
        if: steps.check.outputs.exists != 'true'
        run: |
          docker pull --platform linux/arm64 debian:trixie
          cid=$(docker create --platform linux/arm64 debian:trixie)
          docker export "$cid" | xz -T0 -6 > debian-arm64.tar.xz
          sha256sum debian-arm64.tar.xz | cut -d' ' -f1 > debian-arm64.tar.xz.sha256
          gh release create "$ROOTFS_TAG" debian-arm64.tar.xz debian-arm64.tar.xz.sha256 \
            -R "$GITHUB_REPOSITORY" --latest=false \
            --title "Boddy base system (Debian trixie arm64)" \
            --notes "Downloaded by the Boddy app on first run. Not an app download."

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install patchelf
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Fetch proot binaries
        run: ./scripts/fetch-proot.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Boddy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Boddy-apk
          path: Boddy.apk

      # Every push publishes a release, so the newest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/Boddy.apk
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Boddy test build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Boddy.apk
          body: |
            Test build of Boddy, a no-root Linux desktop for Android.
            Download **Boddy.apk** below and open it on your phone (allow "install unknown apps" when asked).

      # Also keep the newest APK under a git tag so it can be fetched with plain git.
      - name: Store APK in apk-latest tag
        if: github.event_name != 'pull_request'
        run: |
          blob=$(git hash-object -w Boddy.apk)
          tree=$(printf '100644 blob %s\tBoddy.apk\n' "$blob" | git mktree)
          commit=$(git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit-tree "$tree" -m "Boddy APK, build ${{ github.run_number }}")
          git push -f origin "$commit:refs/tags/apk-latest"
