plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wipe.datacleaner'
    compileSdk 34

    defaultConfig {
        applicationId "com.wipe.datacleaner"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            storeFile file("../keystore/datawiper.jks")
            storePassword "datawiper"
            keyAlias "datawiper"
            keyPassword "datawiper"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
