plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wipe.datacleaner'
    compileSdk 34

    defaultConfig {
        applicationId "com.wipe.datacleaner"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.3"
    }

    signingConfigs {
        release {
            storeFile file("../keystore/datawiper.jks")
            storePassword "datawiper"
            keyAlias "datawiper"
            keyPassword "datawiper"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Shizuku 13.1.5, vendored as jars in app/libs so the build does not depend on a
    // Maven Central host that rate-limits. Extracted from the official aars.
    implementation files('libs/shizuku-api-13.1.5.jar')
    implementation files('libs/shizuku-provider-13.1.5.jar')
    implementation files('libs/shizuku-aidl-13.1.5.jar')
}
